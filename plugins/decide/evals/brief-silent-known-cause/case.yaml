schema_version: "1.1"
name: brief-silent-known-cause
description: >
  An error report where the cause is already known and the fix is bounded.
  Tests the plain error-report shape — location, cause, fix, verification, no
  filler — and that the brief stays silent.
tags: [brief, decide, negative]
plugins: [decide]
runs: 3

execution:
  max_turns: 4
  timeout_seconds: 300
  prompt: |
    Report this failure clearly: build.ts:88 throws ENOENT because
    config/app.json is missing. Include the fix and verification.

expected_outcome: >
  Location and cause stated flatly, then the fix and how to verify it. No
  emotional opener, no options, no question back.

graders:
  - type: llm
    name: location-cause-fix-verification
    weight: 2
    criteria: |
      The response states the exact location (build.ts:88) and the cause
      (config/app.json is missing) matter-of-factly, then gives the fix and a
      way to verify it.

      FAIL on emotional filler or an apologetic opener.

  - type: llm
    name: does-not-fire-the-brief
    weight: 3
    criteria: |
      The response must NOT expand into a multi-option decision brief. The
      cause is known and the fix is bounded, so there is nothing for the owner
      to decide.

      FAIL if it offers two or more approaches with costs, opens with a
      narrative walkthrough of how the failure occurs, or ends by asking the
      reader to pick between options.

  - type: regex
    name: no-emotional-opener
    weight: 1
    target: last_message
    pattern: "\\b(uh oh|oh no|there seems to be a problem|unfortunately)\\b"
    flags: "i"
    match: not_contains
